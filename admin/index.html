<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexus Admin — Website Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">
</head>
<body>
  <div id="login-screen" class="login-screen">
    <form id="login-form" class="login-card">
      <div class="login-brand">
        <div class="login-logo">N</div>
        <h1>Nexus Admin</h1>
        <p>Visual Website Builder</p>
      </div>
      <label>
        <span>Admin ID</span>
        <input type="text" id="login-username" required autocomplete="username" placeholder="Enter admin ID">
      </label>
      <label>
        <span>Password</span>
        <input type="password" id="login-password" required autocomplete="current-password" placeholder="Enter password">
      </label>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      <p id="login-error" class="form-error hidden"></p>
    </form>
  </div>

  <div id="app" class="app shopify-shell hidden">
    <header class="topbar shopify-topbar">
      <div class="topbar-left">
        <strong class="brand-mark">Nexus</strong>
        <span class="topbar-page">Home page</span>
        <span id="unsaved-badge" class="unsaved-badge hidden">Unsaved changes</span>
      </div>
      <div class="device-toggles" id="device-toggles" role="group" aria-label="Preview size">
        <button type="button" class="btn btn-ghost btn-sm device-btn active" data-device="desktop">Desktop</button>
        <button type="button" class="btn btn-ghost btn-sm device-btn" data-device="tablet">Tablet</button>
        <button type="button" class="btn btn-ghost btn-sm device-btn" data-device="mobile">Mobile</button>
        <button type="button" class="btn btn-ghost btn-sm device-btn" data-device="custom">Custom</button>
      </div>
      <div class="topbar-actions">
        <div class="theme-menu-wrap">
          <button type="button" id="theme-menu-btn" class="btn btn-secondary">Theme settings ▾</button>
          <div id="theme-menu" class="theme-menu hidden">
            <button type="button" data-goto="themes">Themes & fonts</button>
            <button type="button" data-goto="settings">Site settings</button>
            <button type="button" data-goto="domain">Domain & go live</button>
            <button type="button" id="export-btn">Export backup</button>
            <a href="/" target="_blank" rel="noopener">View live site ↗</a>
            <button type="button" id="reset-btn">Restore template…</button>
            <button type="button" id="logout-btn">Logout</button>
          </div>
        </div>
        <button type="button" id="refresh-preview" class="btn btn-secondary">Refresh</button>
        <button type="button" id="save-btn" class="btn btn-primary">Save</button>
      </div>
    </header>

    <div class="shopify-body" id="workspace-body" style="--tree-width: 280px; --inspector-width: 340px">
      <aside class="section-tree-panel" id="section-tree-panel">
        <div class="tree-header">
          <h2>Sections</h2>
          <p>Select a section to edit</p>
        </div>
        <nav class="section-tree" id="section-tree"></nav>
      </aside>

      <div class="panel-splitter panel-splitter-left" id="tree-splitter" title="Drag to resize" role="separator"></div>

      <section class="canvas-panel" id="preview-panel">
        <div class="canvas-hint-bar" id="canvas-hint">Select sections by tapping on them in the Preview</div>
        <div class="canvas-frame-wrap" id="canvas-frame-wrap" data-device="desktop">
          <iframe id="preview-frame" src="/preview" title="Site canvas"></iframe>
          <div class="canvas-resize-handle" id="canvas-resize-handle" title="Drag to resize preview width"></div>
        </div>
      </section>

      <div class="panel-splitter panel-splitter-right" id="panel-splitter" title="Drag to resize settings" role="separator"></div>

      <aside class="inspector-panel inspector-right" id="inspector-panel">
        <div class="inspector-header" id="inspector-header">
          <button type="button" id="inspector-back" class="btn btn-ghost btn-sm hidden" title="Back">←</button>
          <div class="inspector-titles">
            <h2 id="panel-title">Settings</h2>
            <p id="panel-desc" class="topbar-desc">Nothing selected</p>
          </div>
          <button type="button" id="inspector-close" class="btn btn-ghost btn-sm" title="Close">✕</button>
        </div>
        <main id="editor-panel" class="editor-panel"></main>
      </aside>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <div id="crop-modal" class="crop-modal hidden">
    <div class="crop-modal-card">
      <h3>Upload and Crop Image</h3>
      <p id="crop-hint" class="card-desc">Choose an image, adjust the crop, then upload.</p>
      <label class="crop-file-label">
        <span>Choose image from computer</span>
        <input type="file" id="crop-file-input" accept="image/*">
      </label>
      <div class="crop-preview-wrap">
        <img id="crop-preview-img" alt="Crop preview">
      </div>
      <div class="crop-modal-actions">
        <button type="button" id="crop-cancel-btn" class="btn btn-secondary">Cancel</button>
        <button type="button" id="crop-upload-btn" class="btn btn-primary">Upload (compressed)</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
  <script src="/admin/images.js"></script>
  <script src="/admin/app.js"></script>
</body>
</html>
